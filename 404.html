<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found</title>
<!-- Styles are inlined deliberately: this page can be served from any depth
     of URL, so a relative link to the stylesheet would often be wrong. -->
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 2rem 1.25rem;
    background: #fff;
    color: #1a1a1a;
    font-family: Georgia, 'Times New Roman', serif;
    line-height: 1.6;
    -webkit-text-size-adjust: 100%;
  }
  .box { max-width: 32rem; text-align: center; }
  h1 { font-size: clamp(1.75rem, 6vw, 2.5rem); margin: 0 0 .75rem; }
  p { color: #5c5c5c; margin: 0 0 1.75rem; }
  a {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    padding: 0 1.25rem;
    background: #1f4d6b;
    color: #fff;
    text-decoration: none;
    border-radius: 3px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: .95rem;
    font-weight: 600;
  }
  a:hover { background: #163a52; }
  @media (prefers-color-scheme: dark) {
    body { background: #0d1117; color: #e6edf3; }
    p { color: #9aa7b4; }
    a { background: #4ea1ff; color: #0d1117; }
  }
</style>
</head>
<body>
<div class="box">
  <h1>Page not found</h1>
  <p>That address doesn’t exist here — it may have been a typo, or a link that has since changed.</p>
  <a href="./">Go to the homepage</a>
</div>
</body>
</html>
